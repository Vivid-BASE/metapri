<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | HEAVY METAL PRINCESS ACADEMY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Cinzel', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #FF007F;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            margin: 0;
            line-height: 1;
        }

        .message {
            font-size: 1.5rem;
            letter-spacing: 3px;
            margin: 20px 0 40px;
        }

        .back-link {
            text-decoration: none;
            color: #fff;
            border: 1px solid #FF007F;
            padding: 12px 30px;
            border-radius: 30px;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            background: rgba(255, 0, 127, 0.1);
        }

        .back-link:hover {
            background: #FF007F;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
            transform: translateY(-3px);
        }

        .glitch-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 0, 127, 0.05) 0%, transparent 70%);
            z-index: -1;
        }
    </style>
</head>

<body>
    <div class="glitch-bg"></div>
    <h1 class="error-code">404</h1>
    <p class="message">PAGE NOT FOUND / ページが見つかりません</p>
    <a href="/" class="back-link">BACK TO HOME</a>
</body>

</html>
